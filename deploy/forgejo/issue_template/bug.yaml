name: Bug
about: "Something in the app doesn't work"
labels: ["type/bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      description: "What they did, what they expected, what they saw instead."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: "Page or link"
      description: "Where in the app, for example https://42clubroom.ensui.dev/c/chess"
  - type: input
    id: browser
    attributes:
      label: "Browser and device"
      description: "For example Firefox 140 on a laptop"
  - type: input
    id: reporter
    attributes:
      label: Reported by
      description: Their login, if they reported it outside the app (in person, by email). Tickets from the app say so themselves.