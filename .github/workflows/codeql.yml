# Code scanning (E22-S01): CodeQL's security queries on the Java backend and the TypeScript frontend, on pull requests,
# pushes to main and weekly. Results show in the repository's Security tab and on the pull request.
name: CodeQL

on:
  pull_request:
    branches: [main, "release-prod-v*"]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"                         # Mondays 04:17 UTC: new queries find old code too

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none                       # no build needed: faster, and nothing compiles twice
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
