# Release images (E22-S02): pushing a version tag (v1.2.0) builds the backend and proxy images from that tag and
# pushes them to GitHub's container registry, where deploy/deploy.sh pulls them:
#   ghcr.io/<owner>/vclubroom-backend:v1.2.0
#   ghcr.io/<owner>/vclubroom-proxy:v1.2.0
# The tagged commit has already passed CI on its way into main or a release branch, so this job only builds.
# Tags are never overwritten here: moving a tag would change what an already-deployed version means.
name: Release images

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write                                # push to ghcr.io with this run's own token; nothing else

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false                      # never leave a release half-pushed

jobs:
  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: proxy                         # nginx serving the built frontend (frontend/Dockerfile)
            context: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub's container registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        env:
          IMAGE_NAME: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')   # registry names are lowercase
          image="ghcr.io/$owner/vclubroom-$IMAGE_NAME:$GITHUB_REF_NAME"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "::error::$image already exists: a released version is never rebuilt. Tag a new version instead."
            exit 1
          fi
          # The source label links the package to this repository on GitHub.
          docker buildx build --push \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" \
            "$CONTEXT"
          echo "Pushed $image" >> "$GITHUB_STEP_SUMMARY"
